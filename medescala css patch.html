<!--
  ╔══════════════════════════════════════════════════════╗
  ║  MEDESCALA — PATCH DE VIEWPORT FULLSCREEN            ║
  ║  Adicione este bloco ANTES do </style> existente     ║
  ╚══════════════════════════════════════════════════════╝
-->

<!-- PASSO 1: Substitua o meta viewport existente por este -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">

<!-- PASSO 2: Adicione este CSS antes do fechamento </style> -->
<style id="viewport-fix">

/* ── html e body ── */
html {
  height: 100%;
  height: -webkit-fill-available;
}
body {
  height: 100%;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  min-height: 100dvh;
  overflow: hidden;
  margin: 0;
  padding: 0;
}

/* ── APP: position:fixed ignora barra do navegador ── */
#APP {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden;
  display: flex;
}

/* ── Topbar: respeita notch e câmera frontal ── */
#TB {
  height: calc(var(--th) + env(safe-area-inset-top, 0px)) !important;
  padding-top: env(safe-area-inset-top, 0px) !important;
  padding-left: calc(16px + env(safe-area-inset-left, 0px)) !important;
  padding-right: calc(16px + env(safe-area-inset-right, 0px)) !important;
  padding-bottom: 10px !important;
  align-items: flex-end !important;
}

/* ── Bottom Nav: respeita home indicator ── */
#BN {
  padding-bottom: env(safe-area-inset-bottom, 0px) !important;
}

/* ── Conteúdo: espaço correto na parte inferior ── */
@media (max-width: 768px) {
  #CONT {
    padding-bottom: calc(
      var(--bh) + env(safe-area-inset-bottom, 0px) + 12px
    ) !important;
  }
  /* Sidebar respeita notch quando aberta */
  #SB {
    padding-top: env(safe-area-inset-top, 0px) !important;
  }
}

/* ── Painéis fixos: posicionados abaixo da topbar real ── */
#NP {
  top: calc(var(--th) + env(safe-area-inset-top, 0px)) !important;
}
#SEARCHPANEL {
  top: calc(var(--th) + env(safe-area-inset-top, 0px)) !important;
}

/* ── Toast: acima da bottom nav ── */
#TC {
  bottom: calc(
    var(--bh) + env(safe-area-inset-bottom, 0px) + 10px
  ) !important;
}

/* ── Login: scroll quando teclado abre ── */
#LS {
  padding-top: calc(16px + env(safe-area-inset-top, 0px)) !important;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important;
  overflow-y: auto !important;
}

/* ── Setup: mesma correção ── */
#SETUP {
  padding-top: calc(20px + env(safe-area-inset-top, 0px)) !important;
}

/* ── Banners de instalação PWA ── */
#IB, #IOT {
  bottom: calc(var(--bh) + env(safe-area-inset-bottom, 0px) + 8px) !important;
}

/* ── Splash: versão no lugar certo ── */
.splash-version {
  bottom: calc(32px + env(safe-area-inset-bottom, 0px)) !important;
}

</style>
